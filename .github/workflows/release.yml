name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
      - run: flutter pub get
      - name: Prepare Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/dot-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=dot-release.jks
          EOF
      - run: flutter build apk --release
      # Ad-hoc signing omits hardened runtime; Developer ID + runtime belongs with notarization.
      - name: Build macOS DMG
        run: ./scripts/build_dmg.sh
      - name: Verify macOS entitlements
        run: |
          app="build/macos/Build/Products/Release/DOT.app"
          if ! codesign -d --entitlements - "$app" 2>&1 | grep -Fq 'com.apple.security.network.server'; then
            echo "macOS app is missing com.apple.security.network.server entitlement." >&2
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          if codesign -d --entitlements - "$app" 2>&1 | grep -Fq 'com.apple.security.app-sandbox'; then
            echo "macOS remote input requires an unsandboxed app." >&2
            exit 1
          fi
      - name: Prepare release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { in_section = 1 }
            in_section && NR > 1 && $0 ~ /^## \[/ && index($0, "## [" version "]") != 1 { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Geen changelog-sectie gevonden voor $TAG_NAME." >&2
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '\n> Deze release bevat een niet-ondertekende APK; Android gebruikt de debug-signing fallback.\n' >> release-notes.md
          fi
      - name: Optional notarization
        if: env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          xcrun notarytool submit build/DOT.dmg --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple build/DOT.dmg
      - name: Checksums
        run: shasum -a 256 build/app/outputs/flutter-apk/app-release.apk build/DOT.dmg > checksums-sha256.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/DOT.dmg
            checksums-sha256.txt
